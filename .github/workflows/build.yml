name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '4334d8b4c8916018600212ab4dd4bbdc343065d1'
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'

    - name: Install wxWidgets
      run: |
        ${{ github.workspace }}/vcpkg/vcpkg.exe install wxwidgets:x64-windows-static --triplet x64-windows-static

    - name: Configure CMake
      run: |
        $WXROOT="${{github.workspace}}/vcpkg/installed/x64-windows-static"
        cmake -B ${{github.workspace}}/build `
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
          -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DwxWidgets_USE_STATIC=ON `
          -DwxWidgets_INCLUDE_DIRS="$WXROOT/include" `
          -DwxWidgets_LIB_DIR="$WXROOT/lib"


    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LaminaIDE-Windows
        path: ${{github.workspace}}/build/bin/Release/
